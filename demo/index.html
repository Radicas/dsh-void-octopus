<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Void Octopus — ambient companion</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #cfefff;
        --dim: #5c7f95;
        --cyan: #6ef4ff;
        --violet: #a977ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #010207;
        overflow: hidden;
        font-family: ui-sans-serif, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      }

      #app {
        position: fixed;
        left: 50%;
        top: 50%;
        width: min(92vmin, 760px);
        height: min(92vmin, 760px);
        transform: translate(-50%, -50%);
      }

      #app canvas {
        display: block;
      }

      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 42%, rgba(0, 0, 0, 0) 35%, rgba(0, 0, 0, 0.45) 78%, rgba(0, 0, 0, 0.82) 100%),
          linear-gradient(180deg, rgba(1, 2, 7, 0.55) 0%, rgba(1, 2, 7, 0) 18%, rgba(1, 2, 7, 0) 78%, rgba(1, 2, 7, 0.75) 100%);
      }

      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: var(--ink);
        transition: opacity 0.4s ease;
      }

      #ui.is-hidden {
        opacity: 0;
      }

      .brand {
        position: absolute;
        top: 26px;
        left: 30px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .brand-mark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #dff8ff;
        text-shadow: 0 0 18px rgba(110, 244, 255, 0.35);
      }

      .brand-mark::before {
        content: "";
        width: 22px;
        height: 1px;
        background: linear-gradient(90deg, rgba(110, 244, 255, 0), var(--cyan));
        box-shadow: 0 0 8px var(--cyan);
      }

      .brand-sub {
        font-size: 10px;
        letter-spacing: 0.18em;
        color: var(--dim);
        text-transform: uppercase;
      }

      .state {
        position: absolute;
        top: 27px;
        right: 30px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 11px;
        border: 1px solid rgba(110, 244, 255, 0.16);
        border-radius: 999px;
        background: rgba(2, 8, 16, 0.42);
        backdrop-filter: blur(8px);
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9dd9ea;
      }

      .state-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 10px var(--cyan), 0 0 22px rgba(110, 244, 255, 0.45);
        animation: breathe 3.4s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }

      .hint {
        position: absolute;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 9px 16px;
        border: 1px solid rgba(110, 244, 255, 0.12);
        border-radius: 999px;
        background: rgba(2, 7, 14, 0.4);
        backdrop-filter: blur(9px);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: #7fa6b8;
        white-space: nowrap;
      }

      .hint kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        margin-right: 4px;
        border: 1px solid rgba(140, 230, 255, 0.26);
        border-radius: 4px;
        background: rgba(110, 244, 255, 0.06);
        color: #cdf6ff;
        font: inherit;
        font-size: 9px;
        letter-spacing: 0;
      }

      .hint .sep {
        width: 1px;
        height: 16px;
        background: rgba(110, 244, 255, 0.14);
      }

      #toast {
        position: fixed;
        left: 50%;
        bottom: 82px;
        transform: translate(-50%, 6px);
        padding: 7px 12px;
        border: 1px solid rgba(110, 244, 255, 0.2);
        border-radius: 6px;
        background: rgba(1, 5, 12, 0.7);
        color: #bff6ff;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      #toast.is-on {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 640px) {
        .brand {
          top: 18px;
          left: 18px;
        }
        .state {
          top: 18px;
          right: 18px;
        }
        .hint {
          bottom: 16px;
          gap: 10px;
          padding: 8px 12px;
          font-size: 9px;
        }
        .hint .sep,
        .hint .hide-on-mobile {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="ui">
      <div class="brand">
        <div class="brand-mark">Void Octopus</div>
        <div class="brand-sub">ambient companion · v0.1</div>
      </div>
      <div class="state">
        <span class="state-dot"></span>
        <span id="state-label">idle</span>
      </div>
      <div class="hint">
        <span><kbd>1</kbd>idle</span>
        <span><kbd>2</kbd>thinking</span>
        <span><kbd>3</kbd>generating</span>
        <span><kbd>4</kbd>tool</span>
        <span class="sep"></span>
        <span class="hide-on-mobile"><kbd>space</kbd>auto</span>
        <span class="hide-on-mobile"><kbd>H</kbd>hide UI</span>
        <span class="hide-on-mobile"><kbd>click</kbd>pulse</span>
      </div>
    </div>
    <div id="toast"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
